
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCUM 战利品管理器</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin>
    
    <style>
      body {
        background-color: #02040a;
        color: #e2e8f0;
        overflow: hidden;
        margin: 0;
        font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      }
      
      /* Cool Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
      ::-webkit-scrollbar-thumb { 
        background: #334155; 
        border-radius: 3px; 
        border: 1px solid rgba(255,255,255,0.05);
      }
      ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

      /* Utilities */
      .glass { 
        background: rgba(10, 15, 30, 0.6); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border-right: 1px solid rgba(255, 255, 255, 0.05); 
      }
      .glass-card { 
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px); 
        border: 1px solid rgba(255, 255, 255, 0.05); 
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover { 
        background: rgba(30, 41, 59, 0.6);
        border-color: rgba(6, 182, 212, 0.4); 
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.1);
        transform: translateY(-2px);
      }

      /* Noise Texture */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Dynamic Aurora Background */
      .bg-aurora {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: -1;
        background: 
          radial-gradient(circle at 0% 0%, rgba(6, 182, 212, 0.05), transparent 40%), 
          radial-gradient(circle at 100% 0%, rgba(168, 85, 247, 0.05), transparent 40%),
          radial-gradient(circle at 50% 100%, rgba(6, 182, 212, 0.05), transparent 40%);
        animation: pulse-glow 15s infinite alternate;
      }

      @keyframes pulse-glow {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.05); }
      }

      /* Input Reset */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Loading Animation Styles */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #02040a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loader-content {
        text-align: center;
        font-family: monospace;
      }
      
      .loader-spinner {
        width: 60px;
        height: 60px;
        border: 2px solid rgba(6, 182, 212, 0.1);
        border-radius: 50%;
        border-top-color: #06b6d4;
        border-bottom-color: #a855f7;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin: 0 auto 20px;
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.1);
      }

      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              scum: {
                950: '#02040a',
                900: '#0b1120',
                800: '#151e32',
                700: '#23304a',
                accent: '#06b6d4', 
                purple: '#a855f7',
                danger: '#f43f5e',
                success: '#10b981',
              }
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
              sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out forwards',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-down': 'slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              slideDown: { '0%': { opacity: '0', transform: 'translateY(-10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              scaleIn: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
            }
          }
        }
      }
    </script>
    
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
  <body>
    <div class="bg-aurora"></div>
    <div class="bg-noise"></div>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-content">
          <div class="loader-spinner"></div>
          <div class="text-scum-accent font-bold tracking-widest text-xl opacity-80" style="text-shadow: 0 0 10px rgba(6,182,212,0.5)">SYSTEM INITIALIZING</div>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
